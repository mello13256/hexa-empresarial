name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Domain tests (layout, orbital geometry, search, persistence, backups, language)
        run: ./gradlew :domain:test --stacktrace

      - name: App tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hexa-empresarial-apks
          path: app/build/outputs/apk/**/*.apk

      # The latest APKs are also kept on the "apks" branch, so they can be fetched with git alone.
      - name: Publish APKs to the apks branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/apks"
          mkdir -p "$out"
          cp app/build/outputs/apk/release/*.apk "$out/hexa-empresarial-release.apk"
          cp app/build/outputs/apk/debug/*.apk "$out/hexa-empresarial-debug.apk"
          cd "$out"
          git init -q -b apks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.apk
          git commit -q -m "APKs de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apks

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
